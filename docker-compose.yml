services:
  chatagent:
    build: .
    container_name: chatagent
    ports:
      - "8320:8320"
    volumes:
      - chatagent-data:/app/backend/data   # SQLite 与知识库向量缓存
      - chatagent-logs:/app/backend/logs   # 日志持久化
    environment:
      CHATAGENT_ENGINE: ${CHATAGENT_ENGINE:-mock}
      CHATAGENT_LLM_API_KEY: ${CHATAGENT_LLM_API_KEY:-}
      CHATAGENT_ALLOWED_IPS: ${CHATAGENT_ALLOWED_IPS:-*}
      CHATAGENT_ALLOWED_CONTACTS: ${CHATAGENT_ALLOWED_CONTACTS:-}
      CHATAGENT_DB_PATH: /app/backend/data/chatagent.db
      CHATAGENT_CONFIG_FILE: /app/backend/data/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8320/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chatagent-data:
  chatagent-logs:
